<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Smart Campus EV Shuttle Tracker banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e676"/>
      <stop offset="1" stop-color="#00b0ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="24" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="52" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="58" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="26" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#title)" filter="url(#glow)">SMART CAMPUS EV SHUTTLE TRACKER
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>
  <text x="500" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#b0bec5" letter-spacing="3">FLEET MONITORING · ROUTE ALLOCATION · AUTO MAINTENANCE
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
  </text>

  <!-- battery (top right) -->
  <g transform="translate(880,170)">
    <rect x="0" y="0" width="70" height="30" rx="5" fill="none" stroke="#00e676" stroke-width="3"/>
    <rect x="72" y="9" width="6" height="12" rx="2" fill="#00e676"/>
    <rect x="5" y="5" width="20" height="20" rx="2" fill="#00e676">
      <animate attributeName="width" values="10;60;60;10" keyTimes="0;0.6;0.9;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- road -->
  <rect x="0" y="228" width="1000" height="52" fill="#11181c"/>
  <line x1="0" y1="254" x2="1000" y2="254" stroke="#ffd54f" stroke-width="3" stroke-dasharray="30 22">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- campus stops -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#90a4ae" text-anchor="middle">
    <circle cx="120" cy="222" r="5" fill="#00b0ff"/><text x="120" y="212">Library</text>
    <circle cx="400" cy="222" r="5" fill="#00b0ff"/><text x="400" y="212">Engineering</text>
    <circle cx="680" cy="222" r="5" fill="#00b0ff"/><text x="680" y="212">Hostel Quad</text>
  </g>

  <!-- shuttle -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-160 0" to="1060 0" dur="9s" repeatCount="indefinite"/>
    <g transform="translate(0,176)">
      <!-- charge trail -->
      <g stroke="#00e676" stroke-linecap="round" opacity="0.7">
        <line x1="-10" y1="30" x2="-40" y2="30" stroke-width="3"><animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/></line>
        <line x1="-10" y1="40" x2="-55" y2="40" stroke-width="3"><animate attributeName="opacity" values="0;1;0" dur="0.7s" repeatCount="indefinite"/></line>
      </g>
      <rect x="0" y="10" width="120" height="44" rx="10" fill="#00e676"/>
      <rect x="10" y="18" width="22" height="16" rx="3" fill="#0f2027"/>
      <rect x="38" y="18" width="22" height="16" rx="3" fill="#0f2027"/>
      <rect x="66" y="18" width="22" height="16" rx="3" fill="#0f2027"/>
      <rect x="94" y="18" width="18" height="24" rx="3" fill="#b2ebf2"/>
      <path d="M52 40 l8 -10 h-5 l5 -9 -12 12 h5 z" fill="#0f2027" transform="translate(-18,4)"/>
      <circle cx="26" cy="56" r="9" fill="#263238"/><circle cx="26" cy="56" r="4" fill="#90a4ae"/>
      <circle cx="94" cy="56" r="9" fill="#263238"/><circle cx="94" cy="56" r="4" fill="#90a4ae"/>
      <circle cx="122" cy="40" r="4" fill="#fff59d"><animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
